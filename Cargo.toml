[package]
name = "thrive"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first Mastodon client, ported to Rust with wxDragon"

[dependencies]
arboard = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
live-region = "0.3.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "native-tls"] }
urlencoding = "2"
wxdragon = { version = "0.9.24", default-features = false, features = ["webview"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.4"
